<?xml version="1.0"?>
<!-- Barcade: two DragonRise zero-delay encoders. Buttons 1-8 = SDL btn 0-7, coin = btn 8, start = btn 9 -->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="COIN1"><newseq type="standard">KEYCODE_5 OR JOYCODE_1_BUTTON9</newseq></port>
            <port type="COIN2"><newseq type="standard">KEYCODE_6 OR JOYCODE_2_BUTTON9</newseq></port>
            <port type="START1"><newseq type="standard">KEYCODE_1 OR JOYCODE_1_BUTTON10</newseq></port>
            <port type="START2"><newseq type="standard">KEYCODE_2 OR JOYCODE_2_BUTTON10</newseq></port>
            <port type="UI_CANCEL"><newseq type="standard">KEYCODE_ESC OR JOYCODE_1_BUTTON10 JOYCODE_2_BUTTON10</newseq></port>
        </input>
    </system>
</mameconfig>
